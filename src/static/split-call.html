<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Split Call Sage</title>
  <link rel="icon" href="/static/sage-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/call.css?v=2">
</head>
<body>
  <main>
    <nav aria-label="Call navigation">
      <a href="/call">← Live call</a>
      <a href="/calls">Review calls</a>
    </nav>
    <section aria-labelledby="call-title">
      <h1 id="call-title">Split Call</h1>
      <p id="status" role="status" aria-live="polite">Hold to talk.</p>
      <label for="voice-model">Voice model</label>
      <select id="voice-model" aria-label="Voice model" disabled>
        <option value="same">Same as chat</option>
      </select>
      <p id="voice-model-status" aria-live="polite"></p>
      <button id="call-button" type="button">Hold to talk</button>
      <p id="timing" aria-live="polite"></p>
      <p id="note">Deepgram listens, Sage writes, then Deepgram speaks each completed sentence. Audio is not stored.</p>
    </section>
  </main>
  <script src="/static/split-call.js?v=2"></script>
</body>
</html>
