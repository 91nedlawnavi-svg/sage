<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Call Sage</title>
  <link rel="icon" href="/static/sage-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/call.css?v=1">
</head>
<body>
  <main>
    <nav aria-label="Call navigation">
      <a href="/">← Chat</a>
      <a href="/call/split">Try split call</a>
    </nav>
    <section aria-labelledby="call-title">
      <h1 id="call-title">Call Sage</h1>
      <p id="status" role="status" aria-live="polite">Ready when you are.</p>
      <button id="call-button" type="button" aria-pressed="false">Start call</button>
      <p id="note">Audio talks directly to Gemini Live. Sage can recall relevant local memories, and completed transcripts are saved. Audio is not stored.</p>
    </section>
  </main>
  <script src="/static/call.js?v=2"></script>
</body>
</html>
