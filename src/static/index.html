<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Sage</title>
  <link rel="stylesheet" href="/static/app.css?v=8">
</head>
<body>
  <div id="app">
    <header id="header">
      <div id="header-inner">
        <div id="header-left">
          <span id="status-dot" class="cold" aria-hidden="true"></span>
          <span id="header-title">Sage</span>
          <span id="status" class="sr-only" role="status" aria-live="polite">Connecting</span>
        </div>
        <div id="header-actions">
          <button id="new-chat" type="button" aria-label="Start new chat" title="Start new chat">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5H6.5A2.5 2.5 0 0 0 4 7.5v10A2.5 2.5 0 0 0 6.5 20h10a2.5 2.5 0 0 0 2.5-2.5V12"/><path d="m13 14 7-7-3-3-7 7-1 4 4-1Z"/></svg>
          </button>
          <button id="notebook-toggle" type="button" aria-label="Open notebook" aria-controls="drawer" aria-expanded="false">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4.5h11.5A2.5 2.5 0 0 1 19 7v12.5H7.5A2.5 2.5 0 0 1 5 17V4.5Z"/><path d="M5 17a2.5 2.5 0 0 1 2.5-2.5H19M8 8h7M8 11h5"/></svg>
            <span>Notebook</span>
          </button>
        </div>
      </div>
    </header>

    <main id="messages" aria-label="Conversation" aria-live="polite">
      <div id="empty">
        <h1>What’s on your mind?</h1>
        <p>Message Sage to start a conversation.</p>
      </div>
    </main>

    <form id="composer">
      <label for="message" class="sr-only">Message Sage</label>
      <div id="pv-notice" class="composer-notice" role="status" aria-live="polite" hidden>Held-close mode is on</div>
      <div id="input-row">
        <textarea id="message" rows="1" placeholder="Message Sage" enterkeyhint="enter" required></textarea>
        <button id="send-btn" type="submit" aria-label="Send message">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></svg>
        </button>
      </div>
      <div id="composer-hint">Ctrl / Cmd + Enter to send</div>
    </form>
  </div>

  <div id="drawer-overlay" aria-hidden="true"></div>
  <aside id="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="drawer-title" tabindex="-1">
    <div id="drawer-header">
      <div>
        <span id="drawer-title">Notebook</span>
      </div>
      <button id="drawer-close" type="button" aria-label="Close notebook"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <div id="drawer-tabs" role="tablist" aria-label="Notebook sections">
      <button class="drawer-tab active" data-tab="reflections" role="tab" aria-selected="true">Reflections</button>
      <button class="drawer-tab" data-tab="beliefs" role="tab" aria-selected="false" tabindex="-1">Beliefs</button>
      <button class="drawer-tab" data-tab="entities" role="tab" aria-selected="false" tabindex="-1">Entities</button>
    </div>
    <div id="drawer-content">Loading...</div>
  </aside>

  <script src="/static/app.js?v=7"></script>
</body>
</html>
