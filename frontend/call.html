<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sage — Call</title>
<link rel="stylesheet" href="/static/call.css" />
</head>
<body>
<div id="call-page">
  <a href="/" id="back-btn" aria-label="Back to chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Chat
  </a>

  <div id="orb-wrap">
    <canvas id="orb"></canvas>
  </div>

  <div id="status-label" aria-live="polite">Hold to talk</div>

  <button id="mic-btn" aria-label="Hold to talk">
    <svg id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26">
      <path d="M12 1a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19 10a7 7 0 0 1-14 0" stroke-linecap="round"/>
      <line x1="12" y1="19" x2="12" y2="23" stroke-linecap="round"/>
      <line x1="8" y1="23" x2="16" y2="23" stroke-linecap="round"/>
    </svg>
  </button>
</div>
<script src="/static/call.js"></script>
</body>
</html>
